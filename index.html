<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="author" content="Wendel Emílio de Souza Matias — oficial.respostas@gmail.com">

<title>Guardião Imagens</title>
<!--
  Guardião Imagens 3.0 — fotos com prova de hora e local
  Desenvolvido por Wendel Emílio de Souza Matias — oficial.respostas@gmail.com
-->
<style>
:root{
  --ouro:#D4AF37; --ouro2:#F1D27A; --ouro-esc:#8A6D12;
  --preto:#0b0b0b; --card:#151515; --card2:#1d1d1d; --borda:#2b2b2b;
  --verm:#C8102E; --verm2:#ff5a6e; --texto:#f2f2f2; --suave:#a2a2a2; --ok:#43d18e;
  --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--preto);color:var(--texto);font:15px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{min-height:100%;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
.tela{max-width:760px;margin:0 auto;padding:14px 14px 24px}
h2{margin:4px 0 12px;font-size:22px}
h3{margin:0 0 10px;font-size:16px;color:var(--ouro2)}
p{margin:0 0 10px}
.cab{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.cab-acoes{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:14px;margin-bottom:12px}
.suave{color:var(--suave);font-size:13px}
.btn{border:1px solid var(--borda);background:var(--card2);border-radius:11px;padding:11px 16px;cursor:pointer;font-weight:600}
.btn:active{transform:scale(.98)}
.btn.ouro{background:var(--ouro);border-color:var(--ouro);color:#111}
.btn.verm{background:var(--verm);border-color:var(--verm);color:#fff}
.btn.contorno{background:transparent;border-color:var(--ouro);color:var(--ouro2)}
.btn.mini{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.cheio{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.linha-bot{display:flex;gap:8px;flex-wrap:wrap}
.linha-bot .btn{flex:1 1 140px}
.campo{display:block;margin-bottom:11px}
.campo>span{display:block;font-size:13px;color:var(--suave);margin-bottom:5px}
.campo>span b{color:var(--verm2)}
input[type=text],input[type=date],input[type=search],input[type=password],select,textarea{width:100%;background:#0f0f0f;border:1px solid var(--borda);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ouro)}
textarea{min-height:70px;resize:vertical}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--borda);background:var(--card2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.ativo{border-color:var(--ouro);background:#2a2410;color:var(--ouro2)}
.vazio{text-align:center;padding:40px 16px;color:var(--suave)}

/* navegação */
nav.abas{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#070707;border-top:1px solid #222;display:flex;z-index:20}
nav.abas button{flex:1;background:none;border:0;color:#8d8d8d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;cursor:pointer;position:relative}
nav.abas button.ativo{color:var(--ouro2)}
nav.abas svg{width:24px;height:24px}
.bolinha{position:absolute;top:7px;right:calc(50% - 22px);background:var(--verm);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;min-width:17px;line-height:17px}

/* câmera */
.cam{position:fixed;left:0;right:0;top:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));background:#000;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-topo{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;background:linear-gradient(#000a,#0000)}
.selos{display:flex;flex-direction:column;gap:6px}
.selo{display:inline-flex;align-items:center;gap:6px;background:#000a;border:1px solid #fff2;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.selo i{width:8px;height:8px;border-radius:50%;background:#888}
.selo.ok i{background:var(--ok)} .selo.alerta i{background:#f5a524} .selo.erro i{background:var(--verm2)}
.botoes-topo{display:flex;gap:8px}
.redondo{width:44px;height:44px;border-radius:50%;background:#000a;border:1px solid #fff3;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.redondo svg{width:22px;height:22px}
.redondo.ligado{background:var(--ouro);color:#111}
.previa{position:absolute;left:12px;bottom:118px;max-width:min(520px,calc(100% - 24px));background:#000000a0;border-left:4px solid var(--ouro);border-radius:10px;padding:9px 13px;pointer-events:none}
.previa .ph{display:flex;align-items:center;gap:10px}
.previa .hh{font-size:34px;font-weight:800;color:var(--ouro2);line-height:1}
.previa .dd{font-size:12px;border-left:2px solid var(--ouro);padding-left:9px;line-height:1.3}
.previa .tag{display:inline-block;margin:6px 0 4px;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.3px}
.previa .ll{font-size:12px;color:#eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam-base{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#0000,#000c)}
.disparo{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--ouro);cursor:pointer;box-shadow:0 0 0 3px #0007;display:flex;align-items:center;justify-content:center}
.disparo:active{transform:scale(.93)}
.disparo.ocupado{background:#666}
.ultima{width:54px;height:54px;border-radius:12px;border:2px solid #fff6;background:#222 center/cover;cursor:pointer}
.btn-modelo{min-width:54px;max-width:120px;height:54px;border-radius:12px;border:2px solid var(--ouro);background:#000a;color:var(--ouro2);font-size:11px;font-weight:700;cursor:pointer;padding:4px 8px;line-height:1.15}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.85;transition:none}
.sem-cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px;color:#ddd}

/* galeria */
.dia-tit{margin:16px 0 8px;font-size:13px;font-weight:700;color:var(--ouro2)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.mini-foto{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#222 center/cover;cursor:pointer;border:2px solid transparent}
.mini-foto .marca{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:10px;font-weight:700;background:linear-gradient(#0000,#000d)}
.mini-foto .nuvem{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:#000b;display:flex;align-items:center;justify-content:center;font-size:11px}
.mini-foto.sel{border-color:var(--ouro)}
.mini-foto.sel::after{content:"✓";position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:50%;background:var(--ouro);color:#111;font-weight:800;display:flex;align-items:center;justify-content:center}
.barra-sel{position:sticky;bottom:calc(var(--nav) + 8px);margin-top:12px;background:#1e1a0c;border:1px solid var(--ouro);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.barra-sel b{flex:1 1 100%;font-size:13px;color:var(--ouro2)}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.filtros .largo{grid-column:1/-1}

/* lista de dados */
.dados{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
.dados dt{color:var(--suave)}
.dados dd{margin:0;word-break:break-word}
.verificado{color:var(--ok);font-weight:700}
.nao-verificado{color:#f5a524;font-weight:700}

/* equipe */
.item-nuvem{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--borda)}
.item-nuvem:first-child{border-top:0}
.item-nuvem .info{flex:1;min-width:0;font-size:13px}
.item-nuvem .info b{display:block;font-size:14px}
.item-nuvem .info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--suave)}
.pilha{display:flex;flex-direction:column;gap:6px}
.status-linha{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.status-linha i{width:10px;height:10px;border-radius:50%}

/* relatórios */
.contador{background:#1e1a0c;border:1px solid #4b3f14;color:var(--ouro2);border-radius:10px;padding:10px 12px;font-weight:700;margin:4px 0 12px}
.formatos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formato{background:var(--card2);border:1px solid var(--borda);border-radius:12px;padding:14px;text-align:left;cursor:pointer}
.formato b{display:block;font-size:15px;color:var(--ouro2);margin-bottom:3px}
.formato span{font-size:12px;color:var(--suave)}
.radio-linha{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* ajustes */
.logo-prev{width:84px;height:84px;border-radius:14px;background:#000 center/contain no-repeat;border:1px solid var(--borda)}
.lista-simples{list-style:none;margin:0 0 10px;padding:0}
.lista-simples li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--borda)}
.lista-simples li:first-child{border-top:0}
.rodape{text-align:center;color:#777;font-size:12px;margin-top:18px}

/* janelas */
.modal-fundo{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:surge .15s}
@media(min-width:700px){.modal-fundo{align-items:center}}
@keyframes surge{from{opacity:0}to{opacity:1}}
.modal{background:#121212;border:1px solid #333;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column}
@media(min-width:700px){.modal{border-radius:18px}}
.modal.largo{max-width:760px}
.modal-tit{padding:16px 18px 6px;font-size:18px;font-weight:700;color:var(--ouro2)}
.modal-corpo{padding:8px 18px;overflow:auto}
.modal-bot{display:flex;gap:8px;padding:12px 18px calc(16px + env(safe-area-inset-bottom));flex-wrap:wrap}
.modal-bot .btn{flex:1 1 120px}
.visor img{width:100%;border-radius:10px;display:block;background:#000}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 22px);transform:translateX(-50%);background:#1d1d1d;border:1px solid var(--ouro);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:92vw;box-shadow:0 8px 24px #000a}
.toast.erro{border-color:var(--verm2)}
.carregando{position:fixed;inset:0;background:#000c;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:600}
.giro{width:44px;height:44px;border-radius:50%;border:4px solid #333;border-top-color:var(--ouro);animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.oculto{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<nav class="abas" id="abas"></nav>
<script>

const AUTOR = 'Wendel Emílio de Souza Matias';
const AUTOR_EMAIL = 'oficial.respostas@gmail.com';
const TZ = 'America/Sao_Paulo';

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);

  const el = document.createElement(tag);
  if (props) for (const k in props) {

}
const ICONES = {
  camera: '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.6"/>',

  relatorio: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  ajustes: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  virar: '<path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/>',
  lanterna: '<path d="M8 2h8l-1 6H9z"/><path d="M9 8h6v13H9z"/><path d="M12 12v3"/>'
};
function icone(nome) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '1.8'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
  s.innerHTML = ICONES[nome] || ''; // conteúdo fixo do próprio app
  return s;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const semAcento = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const slug = s => semAcento(s).replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'item';
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const xml = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function novoCodigo() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const r = crypto.getRandomValues(new Uint8Array(8));
  let s = ''; r.forEach((b, i) => { s += A[b % A.length]; if (i === 3) s += '-'; });
  return 'GI-' + s;
}
const fData = new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric' });
const fHora = new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
const fHoraS = new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const fDia = new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, weekday: 'long' });
const fDiaLongo = new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
const fChave = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
function diaChave(ts) {
  const p = {}; fChave.formatToParts(new Date(ts)).forEach(x => p[x.type] = x.value);
  return `${p.year}-${p.month}-${p.day}`;
}
const dataHora = ts => fData.format(new Date(ts)) + ' ' + fHoraS.format(new Date(ts));
function distancia(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function contraste(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#111';
  const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#111' : '#fff';

  const bin = atob(b64); const u = new Uint8Array(bin.length);

async function abrirImagem(blob) {
  if (window.createImageBitmap) { try { return await createImageBitmap(blob); } catch (e) { /* segue */ } }

    const url = URL.createObjectURL(blob); const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); }; im.onerror = e => { URL.revokeObjectURL(url); rej(e); }; im.src = url;
  });

async function reduzir(blob, max, q) {
  const im = await abrirImagem(blob);
  const W = im.width || im.naturalWidth, H = im.height || im.naturalHeight;
  const f = Math.min(1, max / Math.max(W, H));
  const c = document.createElement('canvas'); c.width = Math.round(W * f); c.height = Math.round(H * f);
  const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);

  const f = lado / Math.max(canvas.width, canvas.height);
  const c = document.createElement('canvas'); c.width = Math.round(canvas.width * f); c.height = Math.round(canvas.height * f);
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.72);

/* ---------- configurações ---------- */
const LS = 'gi3_';
const cfg = Object.assign({
  empresa: 'Guardião', resp: '', posto: '', postos: [], logo: '', modelo: 'ronda', campos: {}, nota: '',
  qualidade: 'alta', camLado: 'environment', modelosCustom: [], fbProj: '', fbKey: '', equipe: ''
}, (() => { try { return JSON.parse(localStorage.getItem(LS + 'cfg') || '{}'); } catch (e) { return {}; } })());
function salvarCfg() { try { localStorage.setItem(LS + 'cfg', JSON.stringify(cfg)); } catch (e) { toast('Não foi possível salvar as configurações', true); } }

const MODELOS_BASE = [
  { id: 'ronda', nome: 'Ronda', cor: '#D4AF37', campos: [{ n: 'Nº da ronda', req: true }, { n: 'Ponto de ronda' }, { n: 'Situação', op: ['Normal', 'Atenção', 'Alterado'] }] },

/* ---------- banco de dados local (IndexedDB) ---------- */
const DB = {
  db: null,
  abrir() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('guardiao_imagens', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('meta', { keyPath: 'id' }); d.createObjectStore('blob'); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  gravar(meta, blob) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(['meta', 'blob'], 'readwrite');
      t.objectStore('meta').put(meta);
      if (blob) t.objectStore('blob').put(blob, meta.id);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  todas() {
    return new Promise((res, rej) => {
      const r = this.db.transaction('meta').objectStore('meta').getAll();
      r.onsuccess = () => res(r.result.sort((a, b) => b.ts - a.ts)); r.onerror = () => rej(r.error);
    });
  },
  arquivo(id) {
    return new Promise((res, rej) => {
      const r = this.db.transaction('blob').objectStore('blob').get(id);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  apagar(id) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(['meta', 'blob'], 'readwrite');
      t.objectStore('meta').delete(id); t.objectStore('blob').delete(id);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error);
    });
  }
};

/* ---------- hora verificada ---------- */
const Relogio = {
  base: 0, perf: 0, dev: 0, ok: false,
  async sincronizar() {
    if (!navigator.onLine) { atualizarStatus(); return false; }
    try {
      const t0 = performance.now();
      const r = await fetch('./?hora=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
      const t1 = performance.now();
      const d = r.headers.get('date'); const srv = d ? Date.parse(d) : NaN;
      if (isNaN(srv)) throw new Error('sem data');
      this.base = srv + (t1 - t0) / 2 + 500; this.perf = t1; this.dev = Date.now(); this.ok = true;
    } catch (e) { /* mantém último estado */ }
    atualizarStatus(); return this.ok;
  },
  agora() {
    if (this.ok) {
      const ep = performance.now() - this.perf, ed = Date.now() - this.dev;
      if (Math.abs(ep - ed) < 90000 && ep < 86400000) return { ms: this.base + ep, ok: true };
    }
    return { ms: Date.now(), ok: false };
  }
};

const Endereco = {
  atual: '', ref: null, ocupado: false,
  cache: (() => { try { return JSON.parse(localStorage.getItem(LS + 'end') || '{}'); } catch (e) { return {}; } })(),
  chave: p => p.lat.toFixed(4) + ',' + p.lon.toFixed(4),
  async buscar(p) {
    const k = this.chave(p);

    if (this.ref && distancia(this.ref, p) > 60) this.atual = '';

      const bairro = a.suburb || a.neighbourhood || a.quarter || a.village || a.hamlet;
      const cidade = [a.city || a.town || a.municipality, UF[a.state] || a.state].filter(Boolean).join(' - ');
      this.atual = [rua, bairro, cidade].filter(Boolean).join(', ') || j.display_name || '';

function retArred(x, X, Y, W, H, r) {

  x.lineTo(X + W, Y + H - r); x.quadraticCurveTo(X + W, Y + H, X + W - r, Y + H); x.lineTo(X + r, Y + H);
  x.quadraticCurveTo(X, Y + H, X, Y + H - r); x.lineTo(X, Y + r); x.quadraticCurveTo(X, Y, X + r, Y); x.closePath();
}
function quebrar(x, t, larg) {
  const palavras = String(t).split(/\s+/); const out = []; let l = '';
  for (const p of palavras) { const tt = l ? l + ' ' + p : p; if (x.measureText(tt).width > larg && l) { out.push(l); l = p; } else l = tt; }
  if (l) out.push(l); return out;
}

  const tw = larg - dentro * 2 - barra;
  const d = new Date(m.ts);
  if (logoImg && logoImg.naturalWidth) {

    x.save(); x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 8 * s; x.globalAlpha = 0.95;
    x.drawImage(logoImg, W - pad - lw, pad, lw, lh);
    x.globalAlpha = 1; x.font = `700 ${fS}px ${FAM}`; x.textAlign = 'right'; x.fillStyle = '#fff';
    x.fillText(m.empresa || '', W - pad, pad + lh + fS * 1.25); x.restore();
  }
  x.font = `500 ${fL}px ${FAM}`;
  const linhas = [];
  const add = (t, cor) => quebrar(x, t, tw).forEach(l => linhas.push({ t: l, c: cor || '#fff' }));
  m.campos.forEach(cp => add(cp.n + ': ' + cp.v));
  add('Posto: ' + m.posto);
  if (m.nota) add('Obs.: ' + m.nota, '#F1D27A');
  if (m.end) add(m.end);
  if (m.lat != null) add(`Lat ${m.lat.toFixed(6)}   Lon ${m.lon.toFixed(6)}   (±${Math.round(m.acc)} m)`, '#dcdcdc');
  else add('Localização indisponível no momento da foto', '#ff8a8a');
  add('Responsável: ' + m.resp, '#dcdcdc');
  const hTag = fL * 1.6, lh = fL * 1.34;
  const altura = dentro + fT * 1.02 + 12 * s + hTag + 8 * s + linhas.length * lh + 10 * s + fS * 1.5 + dentro * 0.6;
  const x0 = pad, y0 = H - pad - altura;

  x.fillStyle = '#D4AF37'; x.fillRect(x0, y0 + 10 * s, barra, altura - 20 * s);
  const tx = x0 + barra + dentro; let y = y0 + dentro + fT * 0.84;
  x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 4 * s; x.textAlign = 'left';
  const hora = fHora.format(d);
  x.font = `800 ${fT}px ${FAM}`; x.fillStyle = '#F1D27A'; x.fillText(hora, tx, y);
  const wH = x.measureText(hora).width;
  x.fillStyle = '#D4AF37'; x.fillRect(tx + wH + 18 * s, y - fT * 0.72, 4 * s, fT * 0.76);
  x.font = `700 ${fD}px ${FAM}`; x.fillStyle = '#fff'; x.fillText(fData.format(d), tx + wH + 36 * s, y - fT * 0.40);
  x.font = `500 ${fD * 0.92}px ${FAM}`; x.fillStyle = '#e6e6e6'; x.fillText(cap(fDia.format(d)), tx + wH + 36 * s, y - fT * 0.40 + fD * 1.15);
  y += fT * 0.18 + 12 * s;

  x.font = `800 ${fL * 0.9}px ${FAM}`; x.shadowBlur = 0;

async function registrar(src, origem) {

  const meta = {
    id: uid(), code: novoCodigo(), ts: Math.round(hora.ms), verif: hora.ok, dev: Date.now(),
    lat: p ? p.lat : null, lon: p ? p.lon : null, acc: p ? p.acc : null, end: p ? Endereco.atual : '',
    resp: cfg.resp.trim(), empresa: cfg.empresa.trim(), posto: cfg.posto.trim(),

    origem, sync: 0, versao: VERSAO
  };
  const c = carimbar(src, meta);
  meta.w = c.width; meta.h = c.height;
  const blob = await paraBlob(c, 'image/jpeg', 0.9);
  meta.size = blob.size; meta.hash = await sha256(blob); meta.thumb = miniatura(c, 360);

/* ---------- nuvem da equipe (Firestore) ---------- */
const FS = {
  pronto: () => !!(cfg.fbProj && cfg.fbKey && cfg.equipe),
  base: () => `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(cfg.fbProj.trim())}/databases/(default)/documents`,
  chave: () => encodeURIComponent(cfg.fbKey.trim()),
  async enviar(meta) {

    if (b64.length > 850000) { r = await reduzir(blob, 1200, 0.68); b64 = await blobParaBase64(r.blob); }
    if (b64.length > 950000) { r = await reduzir(blob, 960, 0.6); b64 = await blobParaBase64(r.blob); }
    const hashNuvem = await sha256(r.blob);
    const dados = Object.assign({}, meta); delete dados.thumb; delete dados.sync; dados.hashNuvem = hashNuvem;
    const campos = {
      equipe: { stringValue: cfg.equipe.trim().toUpperCase() }, codigo: { stringValue: meta.code }, hash: { stringValue: meta.hash },
      hashNuvem: { stringValue: hashNuvem }, ts: { integerValue: String(meta.ts) }, quando: { timestampValue: new Date(meta.ts).toISOString() },

  partes.push(latin1(x));

function gerarCSV(fotos) {

      campo('Modelo', liga(h('select', null, h('option', { value: '', text: 'Todos' }), modelos().map(m => h('option', { value: m.id, text: m.nome, selected: r.modelo === m.id }))), 'modelo')),
      campo('Fotógrafo', liga(h('select', null, h('option', { value: '', text: 'Todos' }), resps.map(p => h('option', { value: p, text: p, selected: r.resp === p }))), 'resp'))));
  card1.append(filtrosBox, contador);
  const card2 = h('div', { class: 'card' }, h('h3', { text: '2. Dados do relatório' }),
    campo('Responsável pelo relatório', liga(h('input', { type: 'text', value: r.respRel }), 'respRel', 'input'), true),
    campo('Identificação da ronda / ocorrência', liga(h('input', { type: 'text', value: r.ident, placeholder: 'Ex.: Ronda noturna 08/11 — Chácara São Mateus' }), 'ident', 'input'), true),
    campo('Cliente / local', liga(h('input', { type: 'text', value: r.cliente }), 'cliente', 'input')),
    campo('Observações gerais', liga(h('textarea', { value: r.obs }), 'obs', 'input')));
  const radios = h('div', { class: 'radio-linha' }, [['2', '2 fotos por página'], ['1', '1 foto grande por página'], ['ad', 'Antes e depois']].map(([v, n]) => h('button', {
    class: 'chip' + (r.layout === v ? ' ativo' : ''), text: n, onclick: e => { r.layout = v; radios.querySelectorAll('.chip').forEach(c => c.classList.remove('ativo')); e.currentTarget.classList.add('ativo'); }
  })));
  const card3 = h('div', { class: 'card' }, h('h3', { text: '3. Gerar' }), h('div', { class: 'suave', style: 'margin-bottom:6px', text: 'Arrumação do PDF:' }), radios,
    h('div', { class: 'formatos' },
      h('button', { class: 'formato', onclick: () => gerar('pdf') }, h('b', { text: 'PDF' }), h('span', { text: 'Relatório pronto para entregar ao cliente' })),
      h('button', { class: 'formato', onclick: () => gerar('xlsx') }, h('b', { text: 'Excel' }), h('span', { text: 'Planilha com todos os dados e link do mapa' })),
      h('button', { class: 'formato', onclick: () => gerar('zip') }, h('b', { text: 'Pasta ZIP' }), h('span', { text: 'Fotos originais + planilha + mapa' })),
      h('button', { class: 'formato', onclick: () => gerar('kmz') }, h('b', { text: 'Google Earth' }), h('span', { text: 'Cada foto marcada no mapa' }))));
  t.append(card1, card2, card3);
  atualizar();

  async function gerar(tipo) {
    const fotos = filtrar();
    if (!fotos.length) return aviso('Sem fotos', 'Nenhuma foto entra nos filtros escolhidos.');
    if (!r.respRel.trim() || !r.ident.trim()) return aviso('Faltam dados', 'Preencha o responsável pelo relatório e a identificação da ronda/ocorrência.');
    const info = { empresa: cfg.empresa, resp: r.respRel.trim(), ident: r.ident.trim(), cliente: r.cliente.trim(), obs: r.obs.trim() };
    const base = `Relatorio_${slug(info.ident)}_${diaChave(Date.now())}`;
    const c = carregando('Preparando…');
    try {
      let blob, nome;
      if (tipo === 'pdf') { blob = await gerarPDF(fotos, info, r.layout, n => c.texto(`Montando PDF… foto ${n} de ${fotos.length}`)); nome = base + '.pdf'; }
      else if (tipo === 'xlsx') { blob = gerarXLSX(fotos, info); nome = base + '.xlsx'; }
      else {
        const arqs = []; const pasta = tipo === 'kmz' ? 'files' : 'fotos'; const nomeFoto = m => tipo === 'kmz' ? m.code + '.jpg' : nomeArquivo(m);
        let n = 0;
        for (const m of fotos) {
          c.texto(`Juntando fotos… ${++n} de ${fotos.length}`);
          if (tipo === 'kmz' && m.lat == null) continue;
          let b = await DB.arquivo(m.id); if (!b) continue;
          if (tipo === 'kmz') b = (await reduzir(b, 900, 0.75)).blob;
          arqs.push({ nome: `${pasta}/${nomeFoto(m)}`, dados: new Uint8Array(await b.arrayBuffer()), data: new Date(m.ts) });
        }
        if (tipo === 'kmz') {
          if (!arqs.length) { c.fim(); return aviso('Sem localização', 'Nenhuma das fotos tem coordenadas de GPS.'); }
          arqs.unshift({ nome: 'doc.kml', dados: gerarKML(fotos, info, pasta, nomeFoto) });
          blob = zipar(arqs, 'application/vnd.google-earth.kmz'); nome = base + '.kmz';
        } else {
          arqs.push({ nome: 'planilha.csv', dados: gerarCSV(fotos) }, { nome: 'mapa_google_earth.kml', dados: gerarKML(fotos, info, pasta, nomeFoto) });
          blob = zipar(arqs); nome = base + '.zip';
        }
      }
      c.fim();
      const tipoMime = blob.type || 'application/octet-stream';
      const tamanho = blob.size > 1048576 ? (blob.size / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(blob.size / 1024)) + ' KB';
      const v = await modal('Relatório pronto', h('div', null, h('p', { text: nome }), h('p', { class: 'suave', text: `${fotos.length} foto(s) · ${tamanho}` })),
        [{ t: 'Compartilhar', v: 's', cls: 'ouro' }, { t: 'Baixar', v: 'b' }, { t: 'Fechar', v: null }]);
      if (v === 's') { if (!(await compartilharArquivos([new File([blob], nome, { type: tipoMime })], nome))) baixar(blob, nome); }
      else if (v === 'b') baixar(blob, nome);
    } catch (e) { c.fim(); aviso('Não foi possível gerar', String(e && e.message || e)); }
  }
}

/* ---------- tela: ajustes ---------- */
function telaAjustes(app) {
  const t = h('div', { class: 'tela' }); app.append(t);
  t.append(h('h2', { text: 'Ajustes' }));
  const emp = h('input', { type: 'text', value: cfg.empresa });
  const resp = h('input', { type: 'text', value: cfg.resp });
  const prev = h('div', { class: 'logo-prev', style: `background-image:url("${cfg.logo || 'icon-192.png'}")` });
  const arqLogo = h('input', { type: 'file', accept: 'image/*', class: 'oculto' });
  arqLogo.addEventListener('change', async () => {
    const f = arqLogo.files[0]; arqLogo.value = ''; if (!f) return;
    try {
      const im = await abrirImagem(f); const W = im.width || im.naturalWidth, H = im.height || im.naturalHeight; const k = Math.min(1, 512 / Math.max(W, H));
      const c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(H * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cfg.logo = c.toDataURL('image/png'); salvarCfg(); await carregarLogo(); prev.style.backgroundImage = `url("${cfg.logo}")`; toast('Logo atualizada');
    } catch (e) { toast('Não consegui abrir essa imagem', true); }
  });
  t.append(h('div', { class: 'card' }, h('h3', { text: 'Empresa e responsável' }),
    campo('Nome da empresa (aparece nas fotos e relatórios)', emp),
    campo('Seu nome (responsável pelas fotos)', resp, true),
    h('div', { style: 'display:flex;gap:12px;align-items:center;margin-bottom:12px' }, prev, h('div', { class: 'pilha' },
      h('button', { class: 'btn mini ouro', text: 'Trocar logo', onclick: () => arqLogo.click() }),
      h('button', { class: 'btn mini', text: 'Usar logo padrão', onclick: async () => { cfg.logo = ''; salvarCfg(); await carregarLogo(); prev.style.backgroundImage = 'url("icon-192.png")'; } }))), arqLogo,
    h('button', { class: 'btn ouro cheio', text: 'Salvar', onclick: () => {
      if (!resp.value.trim()) return toast('Digite seu nome', true);
      cfg.empresa = emp.value.trim() || 'Guardião'; cfg.resp = resp.value.trim(); salvarCfg(); toast('Salvo');
    } })));

  const lp = h('ul', { class: 'lista-simples' });
  const desenharPostos = () => {
    lp.replaceChildren(...(cfg.postos || []).map(p => h('li', null, h('span', { text: p }), h('button', { class: 'btn mini', text: 'Remover', onclick: () => { cfg.postos = cfg.postos.filter(x => x !== p); salvarCfg(); desenharPostos(); } }))));
    if (!(cfg.postos || []).length) lp.append(h('li', { class: 'suave', text: 'Nenhum posto cadastrado' }));
  };
  const novoP = h('input', { type: 'text', placeholder: 'Nome do posto ou local' });
  desenharPostos();
  t.append(h('div', { class: 'card' }, h('h3', { text: 'Postos e locais' }), lp,
    h('div', { style: 'display:flex;gap:8px' }, novoP, h('button', { class: 'btn ouro', text: 'Adicionar', onclick: () => {
      const v = novoP.value.trim(); if (!v) return; cfg.postos = [...new Set((cfg.postos || []).concat(v))]; novoP.value = ''; salvarCfg(); desenharPostos();
    } }))));

  const lm = h('ul', { class: 'lista-simples' });
  const desenharModelos = () => {
    lm.replaceChildren(...modelos().map(m => h('li', null,
      h('span', null, h('span', { class: 'chip', style: 'pointer-events:none' }, h('i', { style: 'background:' + m.cor }), m.nome), ' ', h('span', { class: 'suave', text: m.campos.map(c => c.n + (c.req ? '*' : '')).join(', ') || 'sem campos' })),
      m.id.startsWith('c_') ? h('button', { class: 'btn mini', text: 'Remover', onclick: () => { cfg.modelosCustom = cfg.modelosCustom.filter(x => x.id !== m.id); if (cfg.modelo === m.id) cfg.modelo = 'ronda'; salvarCfg(); desenharModelos(); } }) : h('span', { class: 'suave', text: 'padrão' }))));
  };
  desenharModelos();
  const nm = h('input', { type: 'text', placeholder: 'Ex.: Portaria — entrada de visitante' });
  const nc = h('input', { type: 'text', placeholder: 'Ex.: Nome do visitante*, Placa, Apartamento' });
  const cor = h('select', null, [['#D4AF37', 'Dourado'], ['#C8102E', 'Vermelho'], ['#2E9E5B', 'Verde'], ['#3D6FD8', 'Azul'], ['#8E5BD6', 'Roxo'], ['#E07B24', 'Laranja'], ['#6B6B6B', 'Cinza']].map(([v, n]) => h('option', { value: v, text: n })));
  t.append(h('div', { class: 'card' }, h('h3', { text: 'Modelos de carimbo' }), lm,
    h('p', { class: 'suave', text: 'Crie modelos próprios. Separe os campos por vírgula; coloque * no final dos campos obrigatórios.' }),
    campo('Nome do modelo', nm), campo('Campos', nc), campo('Cor', cor),
    h('button', { class: 'btn ouro cheio', text: 'Criar modelo', onclick: () => {
      if (!nm.value.trim()) return toast('Dê um nome ao modelo', true);
      const campos = nc.value.split(',').map(s => s.trim()).filter(Boolean).map(s => ({ n: s.replace(/\*$/, '').trim(), req: s.endsWith('*') }));
      cfg.modelosCustom = (cfg.modelosCustom || []).concat({ id: 'c_' + uid(), nome: nm.value.trim(), cor: cor.value, campos });
      nm.value = ''; nc.value = ''; salvarCfg(); desenharModelos(); toast('Modelo criado');
    } })));

  t.append(h('div', { class: 'card' }, h('h3', { text: 'Qualidade das fotos' }),
    h('div', { class: 'radio-linha' }, [['alta', 'Alta (melhor para provas)'], ['eco', 'Econômica (ocupa menos espaço)']].map(([v, n]) => h('button', {
      class: 'chip' + (cfg.qualidade === v ? ' ativo' : ''), text: n, onclick: () => { cfg.qualidade = v; salvarCfg(); render(); }
    })))));

  const arqB = h('input', { type: 'file', accept: '.zip,application/zip', class: 'oculto' });
  arqB.addEventListener('change', async () => {
    const f = arqB.files[0]; arqB.value = ''; if (!f) return;
    const c = carregando('Lendo backup…');
    try {
      const z = await lerZip(f); const js = z['backup.json']; if (!js) throw new Error('backup.json não encontrado');
      const dados = JSON.parse(new TextDecoder().decode(js)); let n = 0;
      const ids = new Set(estado.fotos.map(x => x.id));
      for (const m of dados.fotos || []) {
        if (ids.has(m.id)) continue; const b = z[`fotos/${m.id}.jpg`]; if (!b) continue;
        await DB.gravar(m, new Blob([b], { type: 'image/jpeg' })); n++;
      }
      await recarregar(); c.fim(); aviso('Backup restaurado', `${n} foto(s) recuperadas. Fotos que já estavam no celular foram mantidas.`);
    } catch (e) { c.fim(); aviso('Não foi possível restaurar', String(e.message || e)); }
  });
  t.append(h('div', { class: 'card' }, h('h3', { text: 'Backup' }),
    h('p', { class: 'suave', text: `${estado.fotos.length} foto(s) neste celular. Faça backup antes de trocar de aparelho ou limpar o navegador.` }),
    h('div', { class: 'linha-bot' },
      h('button', { class: 'btn ouro', text: 'Fazer backup', onclick: async () => {
        if (!estado.fotos.length) return toast('Nada para salvar');
        const c = carregando('Montando backup…');
        try {
          const arqs = [{ nome: 'backup.json', dados: JSON.stringify({ app: 'Guardião Imagens', versao: VERSAO, criado: new Date().toISOString(), fotos: estado.fotos }) }];
          let n = 0; for (const m of estado.fotos) { c.texto(`Foto ${++n} de ${estado.fotos.length}`); const b = await DB.arquivo(m.id); if (b) arqs.push({ nome: `fotos/${m.id}.jpg`, dados: new Uint8Array(await b.arrayBuffer()), data: new Date(m.ts) }); }
          const z = zipar(arqs); c.fim(); baixar(z, `Backup_Guardiao_Imagens_${diaChave(Date.now())}.zip`);
        } catch (e) { c.fim(); aviso('Erro no backup', String(e.message || e)); }
      } }),
      h('button', { class: 'btn', text: 'Restaurar backup', onclick: () => arqB.click() })), arqB));

  if (estado.instalar) t.append(h('div', { class: 'card' }, h('h3', { text: 'Instalar no celular' }),
    h('p', { class: 'suave', text: 'Coloca o Guardião Imagens na tela inicial, como um aplicativo, funcionando sem internet.' }),
    h('button', { class: 'btn ouro cheio', text: 'Instalar app', onclick: async () => { estado.instalar.prompt(); await estado.instalar.userChoice; estado.instalar = null; render(); } })));

  t.append(h('div', { class: 'rodape' }, h('div', { text: `Guardião Imagens ${VERSAO}` }), h('div', { text: `Desenvolvido por ${AUTOR}` }), h('div', { text: AUTOR_EMAIL })));
}

/* ---------- início ---------- */
async function iniciar() {
  try { await DB.abrir(); } catch (e) { $('#app').append(h('div', { class: 'tela' }, h('h2', { text: 'Erro ao abrir o armazenamento' }), h('p', { text: 'Este navegador bloqueou o armazenamento de fotos. Saia do modo anônimo ou use o Chrome.' }))); return; }
  await carregarLogo();
  await recarregar();
  GPS.iniciar();
  Relogio.sincronizar();
  setInterval(() => Relogio.sincronizar(), 5 * 60000);
  setInterval(() => sincronizar(), 60000);
  window.addEventListener('online', () => { Relogio.sincronizar(); sincronizar(); atualizarStatus(); });
  window.addEventListener('offline', atualizarStatus);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Cam.fechar(); return; }
    Relogio.sincronizar();
    if (estado.aba === 'camera') Cam.abrir();
  });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); estado.instalar = e; });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
  sincronizar();
}
iniciar();
